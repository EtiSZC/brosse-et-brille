# Deploys the PWA (iPhone testers) to GitHub Pages: https://etiszc.github.io/brosse-et-brille/
# Triggered only from the phase-8-pwa branch, so main (Android) is untouched until the merge.
name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [phase-8-pwa]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build for the Pages sub-path
        run: npm run build
        env:
          PAGES_BASE: /brosse-et-brille/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
